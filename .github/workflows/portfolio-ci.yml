name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run project tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest portfolio/data-quality-validation/tests -q
          python -m pytest portfolio/python-api-automation/tests -q
          python -m pytest portfolio/business-data-research/tests -q
      - name: Run deterministic pipelines
        run: |
          python portfolio/data-quality-validation/run_validation.py
          python portfolio/business-data-research/run_research.py
